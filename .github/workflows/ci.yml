name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Tests run against committed HTML fixtures, so CI never hits the network.
      - name: Test
        run: npm test
